<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Total Population Growth</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .population-chart-section {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .chart-header h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .chart-container {
            width: 100%;
            height: 400px;
        }

        #populationChart {
            width: 100%;
            height: 100%;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #yearSlider {
            flex: 1;
            min-width: 200px;
        }

        #playBtn {
            padding: 6px 12px;
            cursor: pointer;
        }

        #yearLabel {
            font-weight: bold;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .chart-container {
                height: 300px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="population-chart-section">

    <div class="chart-header">
        <h2>World Total Population (1960–2024)</h2>
    </div>

    <div class="chart-container">
        <svg id="populationChart"></svg>
    </div>

    <div class="controls">
        <input type="range" id="yearSlider" min="1960" max="2024" value="2024" placeholder="Input">
        <button id="playBtn">▶ Play</button>
        <span id="yearLabel">2024</span>
    </div>

</div>


<script>
    
</script>
    
</body>
</html>
